<!doctype html>
<html lang="en">
<head>
    <!-- ========== Page info (paths start with / so this works at any broken address) ========== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Needron</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0814">
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">

    <!-- ========== Fonts ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- ========== Styles ========== -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <script>
        document.documentElement.classList.add('js');
        setTimeout(() => { if (!window.__animeReady) document.documentElement.classList.remove('js'); }, 2500);
    </script>
</head>

<body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <!-- ========== Lost page: the logo runs away from your cursor ========== -->
    <main class="lost" id="main">
        <div class="lost-stage">
            <div class="lost-logo" aria-hidden="true">
                <p class="lost-bubble" hidden>D-Don't touch me! Dummy!</p>
                <img src="/assets/img/logo.svg" alt="" width="160" height="160" draggable="false">
            </div>
        </div>

        <p class="label">Error 404</p>
        <h1>This page drifted off into space.</h1>
        <p class="lost-text">The link might be old, or the address has a typo.</p>
        <a class="btn btn-primary" href="/">Back to the home page</a>
    </main>

    <!-- ========== Script (loads anime.js v4 itself) ========== -->
    <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
